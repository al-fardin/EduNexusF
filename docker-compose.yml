services:
  postgres:
    image: postgres:17
    container_name: edunexus-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: edunexus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/edunexus-database:ro
      - ./scripts/database/initialize-local.sh:/docker-entrypoint-initdb.d/10-edunexus.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edunexus"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8
    container_name: edunexus-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: edunexus-minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:

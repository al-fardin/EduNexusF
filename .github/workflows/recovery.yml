name: Recovery verification
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '20 20 * * 0'
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: edunexus_features
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d edunexus_features"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: edunexus_features
      BACKUP_EXPECTED_USERS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Create isolated schema and sentinel records
        run: |
          for migration in database/migrations/*.up.sql; do psql -X -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -X -v ON_ERROR_STOP=1 -f scripts/qa/recovery-fixtures.sql
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Backup, restore and verify
        run: |
          # Keep dump/restore clients on the same major version as the service.
          docker run --rm --network host \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e BACKUP_EXPECTED_USERS \
            -e BACKUP_RESTORE_REPORT=/verification/restored-database.txt \
            -e BACKUP_RESTORE_UPLOADS_DIR=/verification/restored-uploads \
            -v "$RUNNER_TEMP:/verification" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            postgres:17 sh /workspace/scripts/qa/check-recovery.sh
      - name: Verify restored application routes
        env:
          MATERIAL_UPLOAD_DIR: ${{ runner.temp }}/restored-uploads/materials
          EDUNEXUS_MESSAGE_UPLOAD_DIR: ${{ runner.temp }}/restored-uploads/messages
        run: |
          export EDUNEXUS_RESTORE_DATABASE="$(cat "$RUNNER_TEMP/restored-database.txt")"
          go test -count=1 -v ./backend/internal/platform/server -run TestRedTeamRestoredApplication

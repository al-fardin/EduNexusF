name: Build Android app
on:
  workflow_call:
    inputs:
      workspace_url:
        required: true
        type: string
      release:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      workspace_url:
        description: Workspace origin (HTTPS for release)
        required: true
        type: string
      release:
        description: Sign a production APK
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      EDUNEXUS_ANDROID_KEYSTORE: ${{ github.workspace }}/android-app/.keys/release.jks
      EDUNEXUS_ANDROID_STOREPASS: ${{ secrets.ANDROID_STOREPASS }}
      EDUNEXUS_ANDROID_KEYPASS: ${{ secrets.ANDROID_KEYPASS }}
      EDUNEXUS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify Java formatting
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/google-java-format.jar" https://github.com/google/google-java-format/releases/download/v1.33.0/google-java-format-1.33.0-all-deps.jar
          echo "697707af07c7753f29cba415c6a76b7882702ff464f807da98b28069b8751910  $RUNNER_TEMP/google-java-format.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/google-java-format.jar" --dry-run --set-exit-if-changed $(git ls-files 'android-app/src/*.java' 'android-app/src/**/*.java' 'android-app/firebase-src/**/*.java')
      - name: Verify update trust boundaries
        run: |
          javac -encoding UTF-8 --release 8 -d "$RUNNER_TEMP/update-tests" android-app/src/com/edunexus/mobile/UpdatePolicy.java android-app/tests/UpdatePolicyTest.java
          java -cp "$RUNNER_TEMP/update-tests" com.edunexus.mobile.UpdatePolicyTest
          python scripts/qa/test_android_manifest.py
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.1.0'
      - name: Prepare build inputs
        env:
          WORKSPACE_URL: ${{ inputs.workspace_url }}
          RELEASE: ${{ inputs.release }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_ANDROID_JSON_BASE64 }}
        run: |
          python - <<'PY'
          import os,base64,pathlib,urllib.parse
          origin=urllib.parse.urlparse(os.environ['WORKSPACE_URL'])
          release=os.environ['RELEASE']=='true'
          assert origin.scheme in ('https','http') and origin.hostname and not origin.username and not origin.query and not origin.fragment and origin.path in ('','/'), 'Use a workspace origin'
          if release:
            assert origin.scheme=='https', 'Release requires HTTPS'
            assert all(os.environ.get(k) for k in ('KEYSTORE_BASE64','EDUNEXUS_ANDROID_STOREPASS','EDUNEXUS_ANDROID_KEYPASS')), 'Configure Android signing secrets'
          folder=pathlib.Path('android-app/.keys');folder.mkdir(exist_ok=True)
          if release: pathlib.Path(os.environ['EDUNEXUS_ANDROID_KEYSTORE']).write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
          if os.environ.get('FIREBASE_CONFIG'): pathlib.Path('android-app/google-services.json').write_bytes(base64.b64decode(os.environ['FIREBASE_CONFIG'],validate=True))
          PY
          sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
          keytool -genkeypair -keystore android-app/.keys/debug.keystore -storepass android -keypass android -alias edunexus -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=EduNexus Debug'
      - name: Build and verify
        env:
          WORKSPACE_URL: ${{ inputs.workspace_url }}
          RELEASE: ${{ inputs.release }}
        run: |
          variant=Debug
          if [ "$RELEASE" = true ]; then variant=Release; else unset EDUNEXUS_ANDROID_KEYSTORE; fi
          gradle -p android-app --no-daemon "assemble$variant" "-PworkspaceUrl=$WORKSPACE_URL" "-PlocalTesting=$([ "$RELEASE" = true ] && echo false || echo true)"
          mkdir -p release-bundle
          apk=$(find "android-app/build/outputs/apk/${variant,,}" -name '*.apk' -print -quit)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" "release-bundle/EduNexus-${variant,,}.apk"
          if [ "$RELEASE" = true ]; then python deploy/android-manifest.py release-bundle/EduNexus-release.apk release-bundle/android.json; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EduNexus-Android-${{ inputs.release && 'release' || 'debug' }}
          path: release-bundle/
          retention-days: 14

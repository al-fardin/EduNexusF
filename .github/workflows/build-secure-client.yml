name: Build EduNexus Secure Exam Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test desktop client
        run: |
          python -m pip install -r desktop-client/requirements.txt
          python -m unittest discover -s desktop-client/tests -v

      - name: Build Windows EXE
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop-client/requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon desktop-client/assets/icon.ico --name EduNexus-Secure-Exam --add-data "desktop-client/assets:assets" desktop-client/client.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EduNexus-Windows
          path: dist/EduNexus-Secure-Exam.exe

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: Intel
          - runner: macos-latest
            arch: AppleSilicon

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build macOS App
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop-client/requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name EduNexus-Secure-Exam --add-data "desktop-client/assets:assets" desktop-client/client.py

      - name: Package DMG
        run: |
          hdiutil create -volname "EduNexus Secure Exam" -srcfolder dist/EduNexus-Secure-Exam.app -ov -format UDZO dist/EduNexus-Secure-Exam-${{ matrix.arch }}.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EduNexus-macOS-${{ matrix.arch }}
          path: dist/*.dmg

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv patchelf

      - name: Build Linux Executable
        run: |
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r desktop-client/requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name EduNexus-Secure-Exam --add-data "desktop-client/assets:assets" desktop-client/client.py
          tar -czf EduNexus-Secure-Exam-Linux-x64.tar.gz -C dist EduNexus-Secure-Exam

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EduNexus-Linux
          path: EduNexus-Secure-Exam-Linux-x64.tar.gz
